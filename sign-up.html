<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Azuris Coastal Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="signup-style.css" />
</head>

<body>

    <main class="screen">

        <a href="login.html" class="screen__back" aria-label="Go back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </a>

        <div class="screen__logo-wrap">
            <img src="image/logo.png" alt="Azuris Coastal Hotel" class="screen__logo" />
        </div>

        <h1 class="screen__title">Create Account</h1>

        <form class="signup" id="signupForm" action="#" method="post" novalidate>

            <div class="field">
                <label for="fullname" class="field__label">Full Name</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
                    </svg>
                    <input type="text" id="fullname" name="fullname" class="field__input" placeholder="Juan Dela Cruz"
                        autocomplete="name" required />
                </div>
            </div>

            <div class="field">
                <label for="email" class="field__label">Email Address</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <polyline points="22 6 12 13 2 6" />
                    </svg>
                    <input type="email" id="email" name="email" class="field__input" placeholder="you@example.com"
                        autocomplete="email" required />
                </div>
            </div>

            <div class="field">
                <label for="password" class="field__label">Password</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="4" y="11" width="16" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input type="password" id="password" name="password" class="field__input"
                        placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
                    <button type="button" class="field__toggle" data-target="password" aria-label="Show password">
                        <svg class="icon-hidden" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                        <svg class="icon-shown" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm" class="field__label">Confirm Password</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="4" y="11" width="16" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input type="password" id="confirm" name="confirm" class="field__input"
                        placeholder="Re-enter password" autocomplete="new-password" required />
                    <button type="button" class="field__toggle" data-target="confirm"
                        aria-label="Show confirm password">
                        <svg class="icon-hidden" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                        <svg class="icon-shown" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <p class="form__error" id="formError" role="alert" hidden></p>

            <button type="submit" class="btn btn--primary">Sign Up</button>
        </form>
    
        <p class="screen__footer">
            Already have an account?
            <a href="../log in/login.html" class="screen__footer-link">Log In</a>
        </p>

    </main>

    <script>
        document.querySelectorAll(".field__toggle").forEach((btn) => {
            btn.addEventListener("click", () => {
                const input = document.getElementById(btn.dataset.target);
                const showing = input.type === "text";
                const name = btn.dataset.target === "confirm" ? "confirm password" : "password";
                input.type = showing ? "password" : "text";
                btn.classList.toggle("is-visible", !showing);
                btn.setAttribute("aria-label", (showing ? "Show " : "Hide ") + name);
            });
        });

        const form = document.getElementById("signupForm");
        const errorEl = document.getElementById("formError");
        const pwd = document.getElementById("password");
        const confirmPwd = document.getElementById("confirm");

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.hidden = false;
        }

        function clearError() {
            errorEl.hidden = true;
        }

        form.addEventListener("input", clearError);

        form.addEventListener("submit", (e) => {
            const name = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();

            if (!name || !email) {
                e.preventDefault();
                return showError("Please fill in your name and email.");
            }
            if (!form.email.checkValidity()) {
                e.preventDefault();
                return showError("Please enter a valid email address.");
            }
            if (pwd.value.length < 8) {
                e.preventDefault();
                return showError("Password must be at least 8 characters.");
            }
            if (pwd.value !== confirmPwd.value) {
                e.preventDefault();
                return showError("Passwords do not match.");
            }
        });
    </script>

</body>

</html>
