<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Azuris Coastal Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="login-style.css" />
</head>

<body>

    <!-- ============================================================
       LOGIN SCREEN
  ============================================================ -->
    <main class="screen">

        <!-- Back button -->
        <a href="home.html" class="screen__back" aria-label="Go back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </a>

        <!-- Logo -->
        <div class="screen__logo-wrap">
            <img src="images/logo.png"
                alt="Azuris Coastal Hotel" class="screen__logo" />
        </div>

        <!-- Login form -->
        <form class="login" action="#" method="post">

            <!-- Email -->
            <div class="field">
                <label for="email" class="field__label">Email Address</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <polyline points="22 6 12 13 2 6" />
                    </svg>
                    <input type="email" id="email" name="email" class="field__input" placeholder="you@example.com"
                        autocomplete="email" required />
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password" class="field__label">Password</label>
                <div class="field__box">
                    <svg class="field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <rect x="4" y="11" width="16" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input type="password" id="password" name="password" class="field__input" placeholder="Password"
                        autocomplete="current-password" required />
                    <button type="button" class="field__toggle" id="togglePassword" aria-label="Show password">
                        <!-- eye-off (default: password hidden) -->
                        <svg class="icon-hidden" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                        <!-- eye (password visible) -->
                        <svg class="icon-shown" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary">Log In</button>
        </form>

        <!-- Divider -->
        <div class="divider"><span>or</span></div>

        <!-- Google sign-in -->
        <button type="button" class="btn btn--google">
            <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            Continue with Google
        </button>

        <!-- Footer links -->
        <p class="screen__footer">
            <a href="../forgot password/forgotpassword.html">Forgot Password?</a>
            <a href="../sign up/signup.html" class="screen__footer-link">Sign Up</a>
        </p>

    </main>

    <script>
        // Show / hide password
        const toggle = document.getElementById("togglePassword");
        const pwd = document.getElementById("password");

        toggle.addEventListener("click", () => {
            const showing = pwd.type === "text";
            pwd.type = showing ? "password" : "text";
            toggle.classList.toggle("is-visible", !showing);
            toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        });
    </script>

</body>

</html>
