<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log In | Azuris Coastal Hotel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700;900&display=swap" />

  <link rel="stylesheet" href="login-style.css" />
</head>

<body>
<div class="page">

  <!-- TOP BAR -->
  <header class="topbar">
    <a href="index.html" class="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 4 7 12 15 20"/></svg>
    </a>
  </header>

  <!-- LOGO -->
  <a href="login.html" class="logo"><img src="images/logo.png" alt="Azuris Coastal Hotel" /></a>

  <!-- FORM -->
  <form class="form" action="#" method="post">

    <div class="field">
      <label for="email">Email Address</label>
      <div class="input">
        <svg class="lead" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><polyline points="3 6.5 12 13 21 6.5"/></svg>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input">
        <svg class="lead lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button type="button" class="eye" data-target="password" aria-label="Show password">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/><line class="slash" x1="3" y1="20" x2="21" y2="4" stroke-width="2.2"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">Log In</button>

    <!-- divider -->
    <div class="divider"><span>or</span></div>

    <!-- google -->
    <button type="button" class="btn-google">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>
  </form>

  <p class="signup">Forgot Password? <a href="../sign up/sign-up.html">Sign Up</a>

</div>

<script>
  // password show / hide (slash icon = hidden)
  document.querySelectorAll('.eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('shown', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
</script>
</body>
</html>
