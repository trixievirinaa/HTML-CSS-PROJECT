<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allora Cove | Azuris Coastal Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="roomstyle.css" />
</head>

<body>

    <main class="screen" id="room" data-name="Allora Cove" data-type="Standard" data-rate="4200" data-guests="2">

        <a href="javascript:history.back()" class="screen__back" aria-label="Go back">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </a>

        <div class="screen__scroll">

            <header class="hero">
                <img src="image/room-s.jpg" alt="Allora Cove room" class="hero__img" />
            </header>

            <section class="sheet">

                <div class="sheet__top">
                    <h1 class="sheet__name">Allora Cove</h1>
                    <p class="rating">
                        <svg class="rating__star" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2l3 6.5 7 .9-5.1 4.9 1.3 7L12 17.8l-6.2 3.5 1.3-7L2 9.4l7-.9z" />
                        </svg>
                        4.9 (119)
                    </p>
                </div>

                <p class="sheet__guests">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="9" cy="8" r="3.5" />
                        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
                        <circle cx="17" cy="9" r="2.8" />
                        <path d="M16.5 14.2c3.2 0 5 2 5 5" />
                    </svg>
                    2 Guests
                </p>

                <hr class="sheet__divider" />

                <h2 class="sheet__heading">Description</h2>
                <p class="sheet__text">
                    A cozy and practical room for guests seeking a comfortable coastal stay with essential hotel
                    amenities
                </p>

                <hr class="sheet__divider" />

                <h2 class="sheet__heading">Amenities</h2>
                <ul class="amenities">
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 20v-6h18v6" />
                            <path d="M5 14V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6" />
                            <path d="M8 11h3v3H8zM13 11h3v3h-3z" />
                        </svg>
                        1 King Bed
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="2" y="5" width="20" height="8" rx="2" />
                            <line x1="5" y1="9" x2="19" y2="9" />
                            <path d="M7 16.5l-1 3M12 16.5v3M17 16.5l1 3" />
                        </svg>
                        Air Conditioning
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 12h18v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" />
                            <path d="M6 12V6a2 2 0 0 1 4 0" />
                            <path d="M7 19l-1 2M17 19l1 2" />
                        </svg>
                        Private Bathroom
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 9a15 15 0 0 1 20 0" />
                            <path d="M5.5 12.5a10 10 0 0 1 13 0" />
                            <path d="M9 16a5 5 0 0 1 6 0" />
                            <circle cx="12" cy="19.2" r="0.9" />
                        </svg>
                        Wi-Fi
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="2" y="4" width="20" height="13" rx="1.5" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        Smart - TV
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="5" />
                            <circle cx="12" cy="12" r="2.5" />
                            <path d="M3 4v6a2 2 0 0 0 2 0V4M4 10v10" />
                            <path d="M21 4c-1.5 1-2 3-2 6h2v10" />
                        </svg>
                        Breakfast
                    </li>
                    <li class="amenity">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 3h14" />
                            <rect x="7" y="5" width="10" height="15" rx="1" />
                            <line x1="7" y1="9" x2="17" y2="9" />
                        </svg>
                        Towels
                    </li>
                </ul>

            </section>
        </div>

        <footer class="screen__bar">
            <p class="screen__price">₱ 4, 200 / night</p>
            <a href="../booking details/bookingdetails.html" class="btn" id="bookBtn">Book Now</a>
        </footer>

    </main>

    <script>
        (function () {
            var room = document.getElementById('room');
            var bookBtn = document.getElementById('bookBtn');

            bookBtn.addEventListener('click', function () {
                try {
                    localStorage.setItem('azurisRoom', JSON.stringify({
                        name: room.dataset.name,
                        type: room.dataset.type,
                        rate: Number(room.dataset.rate),
                        guests: Number(room.dataset.guests)
                    }));
                } catch (err) { }
            });
        })();
    </script>

</body>

</html>
